<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For 小汽车</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.glow{
    position:absolute;
    width:800px;
    height:800px;
    border-radius:50%;
    background:
    radial-gradient(
        circle,
        rgba(255,255,255,.18),
        rgba(255,255,255,.05),
        transparent 70%
    );

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    animation:
    breathe 8s ease-in-out infinite;
}

@keyframes breathe{
    0%,100%{
        transform:
        translate(-50%,-50%)
        scale(1);
    }
    50%{
        transform:
        translate(-50%,-50%)
        scale(1.25);
    }
}

#container{
    position:relative;
    z-index:10;
    text-align:center;
    color:white;
    width:min(90vw,900px);
}

.slide{
    position:absolute;
    width:100%;
    left:0;
    top:50%;
    transform:
    translateY(-50%);

    opacity:0;

    transition:
    opacity 1.8s ease,
    transform 1.8s ease;
}

.slide.show{
    opacity:1;
    transform:
    translateY(-55%);
}

.small{
    font-size:24px;
    color:rgba(255,255,255,.65);
    letter-spacing:2px;
}

.big{
    font-size:clamp(48px,8vw,110px);
    font-weight:700;
    line-height:1.15;
}

.huge{
    font-size:clamp(70px,11vw,180px);
    font-weight:700;
}

.white{
    color:#fff;
}

.gray{
    color:#86868b;
}

.pink{
    color:#ff6fb5;
}

.code{
    margin-top:30px;

    font-family:
    SFMono-Regular,
    monospace;

    font-size:22px;

    color:#ddd;

    white-space:pre-wrap;
}

.cursor{
    display:inline-block;
    width:10px;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

.music{
    position:fixed;
    bottom:30px;
    right:30px;

    color:white;

    border:1px solid rgba(255,255,255,.15);

    padding:12px 18px;

    border-radius:999px;

    backdrop-filter:blur(20px);

    cursor:pointer;

    font-size:14px;
}

</style>
</head>
<body>

<div class="bg">
    <div class="glow"></div>
</div>

<div id="container"></div>

<div class="music" id="musicBtn">
🎵 Music
</div>

<audio id="audio" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8a9d0ac54.mp3?filename=ambient-piano-amp-strings-10711.mp3">
</audio>

<script>

const slides=[

`
<div class="small">Searching...</div>
`,

`
<div class="big white">
Analyzing
<br>
8,000,000,000 souls
</div>
`,

`
<div class="big gray">
Filtering coincidence
</div>
`,

`
<div class="big gray">
Filtering temporary emotions
</div>
`,

`
<div class="huge white">
1 Result.
</div>
`,

`
<div class="huge white">
Only One.
</div>
`,

`
<div class="huge pink">
小汽车
</div>
`,

`
<div class="big white">
Not because you're perfect.
</div>
`,

`
<div class="big white">
Because you're you.
</div>
`,

`
<div class="big white">
Among billions of people,
<br><br>
you became the person
<br>
I want in my future.
</div>
`,

`
<div class="huge pink">
小汽车
</div>

<div class="big white"
style="margin-top:25px">
我喜欢你
</div>
`,

`
<div class="code">
const future = {

    me: true,

    xiaoqiche: true

};

future.together = true;

await xiaoqiche.reply();
<span class="cursor"></span>

</div>
`

];

const container =
document.getElementById("container");

let index=0;

function nextSlide(){

    container.innerHTML="";

    const div=
    document.createElement("div");

    div.className="slide";

    div.innerHTML=
    slides[index];

    container.appendChild(div);

    requestAnimationFrame(()=>{
        div.classList.add("show");
    });

    index++;

    if(index<slides.length){

        let delay=3500;

        if(index===6) delay=4500;
        if(index===10) delay=5000;

        setTimeout(nextSlide,delay);
    }
}

nextSlide();

const btn=
document.getElementById("musicBtn");

const audio=
document.getElementById("audio");

let playing=false;

btn.onclick=()=>{

    if(!playing){

        audio.play();

        btn.innerHTML=
        "⏸ Music";

        playing=true;

    }else{

        audio.pause();

        btn.innerHTML=
        "🎵 Music";

        playing=false;
    }
}

</script>

</body>
</html>
